[project]
name = "twitter-mcp"
version = "0.1.0"
description = "Twitter MCP Server using twikit"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "twikit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twitter_mcp"]
